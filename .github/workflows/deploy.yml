name: CI/CD Deploy CRM

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '20'
  BUILD_OUTPUT_DIR: 'dist'
  NGINX_ROOT: '/home/phonglv/FE_Y_TE/crm/build'
  BACKUP_DIR: '/home/phonglv/FE_Y_TE/crm/backup'
  INCOMING_DIR: '/tmp/crm-incoming'

jobs:
  ci:
    name: 🔍 CI — Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🔐 Verify sensitive browser storage
        run: npm run security:storage-check

      - name: ✅ Verify build output
        run: |
          if [ ! -f "${{ env.BUILD_OUTPUT_DIR }}/index.html" ]; then
            echo "❌ Build failed: index.html not found in ${{ env.BUILD_OUTPUT_DIR }}/"
            exit 1
          fi
          echo "✅ $(find ${{ env.BUILD_OUTPUT_DIR }} -type f | wc -l) files built"

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-build
          path: ${{ env.BUILD_OUTPUT_DIR }}
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: crm-build
          path: ./${{ env.BUILD_OUTPUT_DIR }}

      - name: 📤 SCP Copy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./${{ env.BUILD_OUTPUT_DIR }}/*"
          target: "${{ env.INCOMING_DIR }}"
          strip_components: 1

      - name: 🔄 Sync & Reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail
            
            # Khai báo lại đường dẫn
            NGINX_ROOT="${{ env.NGINX_ROOT }}"
            BACKUP_DIR="${{ env.BACKUP_DIR }}"
            INCOMING="${{ env.INCOMING_DIR }}"

            # 1. Kiểm tra file
            if [ ! -f "$INCOMING/index.html" ]; then
              echo "❌ ERROR: index.html not found in $INCOMING"
              rm -rf "$INCOMING"
              exit 1
            fi

            # 2. Backup
            mkdir -p "$BACKUP_DIR"
            if [ -d "$NGINX_ROOT" ] && [ "$(ls -A $NGINX_ROOT 2>/dev/null)" ]; then
              cp -r "$NGINX_ROOT" "$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S)"
              ls -dt $BACKUP_DIR/backup-* 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true
            fi

            # 3. Sync
            mkdir -p "$NGINX_ROOT"
            rsync -av --delete "$INCOMING/" "$NGINX_ROOT/"

            # 4. Permissions
            find "$NGINX_ROOT" -type f -exec chmod 644 {} \;
            find "$NGINX_ROOT" -type d -exec chmod 755 {} \;

            # 5. Reload Nginx
            sudo nginx -t && sudo nginx -s reload

            # 6. Dọn dẹp
            rm -rf "$INCOMING"
            echo "✅ Deploy thành công lúc $(date)"

      - name: 🛡️ Verify public security posture
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://dermahealth.fitdnu.id.vn"
          MAX_RETRIES=3
          RETRY_INTERVAL=3

          echo "⏳ Checking public security posture for $BASE_URL..."

          for i in $(seq 1 $MAX_RETRIES); do
            echo "🔍 Security check attempt $i/$MAX_RETRIES..."
            FAILURES=0

            # 1. Smart Check for Sensitive File Leak vs SPA HTML Fallback
            for path in /.env /.git/HEAD; do
              RESPONSE_FILE="$(mktemp)"
              STATUS=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" "$BASE_URL$path" || echo "000")

              if [ "$STATUS" = "200" ]; then
                # If 200 OK, check if it's SPA HTML fallback or actual raw secret leak
                if grep -Eiq '<!doctype html|<html' "$RESPONSE_FILE"; then
                  echo "ℹ️ Path $path returned status 200 (SPA HTML fallback, not a raw secret leak)."
                else
                  echo "❌ CRITICAL: Sensitive path $path is exposing raw secret content with status 200!"
                  FAILURES=$((FAILURES + 1))
                fi
              else
                echo "✅ Path $path safely returned status $STATUS."
              fi
              rm -f "$RESPONSE_FILE"
            done

            # 2. Check Security Headers (Case-insensitive format)
            HTTPS_HEADERS="$(mktemp)"
            curl -sS -o /dev/null -D "$HTTPS_HEADERS" "$BASE_URL/login" || true

            for header in strict-transport-security content-security-policy x-frame-options x-content-type-options referrer-policy; do
              if ! grep -Eiq "^${header}:" "$HTTPS_HEADERS"; then
                echo "⚠️ Warning: Missing header '$header' on server response."
              fi
            done
            rm -f "$HTTPS_HEADERS"

            if [ $FAILURES -eq 0 ]; then
              echo "✅ Security posture verification passed successfully!"
              exit 0
            fi

            echo "⚠️ Attempt $i failed with $FAILURES critical issues. Retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo "❌ Security posture check failed due to raw secret exposure."
          exit 1



