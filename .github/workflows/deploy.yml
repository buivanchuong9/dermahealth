name: CI/CD Deploy CRM

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '20'
  BUILD_OUTPUT_DIR: 'dist'
  NGINX_ROOT: '/home/phonglv/FE_Y_TE/crm/build'
  BACKUP_DIR: '/home/phonglv/FE_Y_TE/crm/backup'
  INCOMING_DIR: '/tmp/crm-incoming'

jobs:
  ci:
    name: 🔍 CI — Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🔐 Verify sensitive browser storage
        run: npm run security:storage-check

      - name: ✅ Verify build output
        run: |
          if [ ! -f "${{ env.BUILD_OUTPUT_DIR }}/index.html" ]; then
            echo "❌ Build failed: index.html not found in ${{ env.BUILD_OUTPUT_DIR }}/"
            exit 1
          fi
          echo "✅ $(find ${{ env.BUILD_OUTPUT_DIR }} -type f | wc -l) files built"

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-build
          path: ${{ env.BUILD_OUTPUT_DIR }}
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: crm-build
          path: ./${{ env.BUILD_OUTPUT_DIR }}

      - name: 📤 SCP Copy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./${{ env.BUILD_OUTPUT_DIR }}/*"
          target: "${{ env.INCOMING_DIR }}"
          strip_components: 1

      - name: 🔄 Sync & Reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail
            
            # Khai báo lại đường dẫn
            NGINX_ROOT="${{ env.NGINX_ROOT }}"
            BACKUP_DIR="${{ env.BACKUP_DIR }}"
            INCOMING="${{ env.INCOMING_DIR }}"

            # 1. Kiểm tra file
            if [ ! -f "$INCOMING/index.html" ]; then
              echo "❌ ERROR: index.html not found in $INCOMING"
              rm -rf "$INCOMING"
              exit 1
            fi

            # 2. Backup
            mkdir -p "$BACKUP_DIR"
            if [ -d "$NGINX_ROOT" ] && [ "$(ls -A $NGINX_ROOT 2>/dev/null)" ]; then
              cp -r "$NGINX_ROOT" "$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S)"
              ls -dt $BACKUP_DIR/backup-* 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true
            fi

            # 3. Sync
            mkdir -p "$NGINX_ROOT"
            rsync -av --delete "$INCOMING/" "$NGINX_ROOT/"

            # 4. Permissions
            find "$NGINX_ROOT" -type f -exec chmod 644 {} \;
            find "$NGINX_ROOT" -type d -exec chmod 755 {} \;

            # 5. Reload Nginx
            sudo nginx -t && sudo nginx -s reload

            # 6. Dọn dẹp
            rm -rf "$INCOMING"
            echo "✅ Deploy thành công lúc $(date)"

      - name: 🛡️ Verify public security posture
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://dermahealth.fitdnu.id.vn"
          HTTP_HEADERS="$(mktemp)"
          HTTPS_HEADERS="$(mktemp)"
          trap 'rm -f "$HTTP_HEADERS" "$HTTPS_HEADERS"' EXIT

          curl -sS -o /dev/null -D "$HTTP_HEADERS" \
            "http://dermahealth.fitdnu.id.vn/login"
          grep -Eiq '^HTTP/[^ ]+ 30(1|8)' "$HTTP_HEADERS"
          grep -Eiq '^location: https://dermahealth\.fitdnu\.id\.vn/login' "$HTTP_HEADERS"

          curl -sS -o /dev/null -D "$HTTPS_HEADERS" "$BASE_URL/login"
          for header in \
            strict-transport-security \
            content-security-policy \
            x-frame-options \
            x-content-type-options \
            referrer-policy \
            permissions-policy; do
            grep -Eiq "^${header}:" "$HTTPS_HEADERS" || {
              echo "Missing required response header: $header" >&2
              exit 1
            }
          done

          for path in /.env /.git/HEAD /openapi.json /sitemap.xml; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL$path")"
            if [ "$status" != "404" ]; then
              echo "Expected 404 for $path, got $status" >&2
              exit 1
            fi
          done

          for tls_version in 1.0 1.1; do
            if curl -sS -o /dev/null \
              --tlsv${tls_version} --tls-max ${tls_version} \
              "$BASE_URL/login"; then
              echo "Obsolete TLS $tls_version is still accepted" >&2
              exit 1
            fi
          done
